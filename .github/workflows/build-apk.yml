name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.json"
      - "sw.js"
      - "icon.svg"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm ci

      - name: Preparar arquivos web
        run: |
          mkdir -p www resources
          cp index.html manifest.json sw.js icon.svg www/
          cp icon.svg resources/icon.svg

      - name: Criar projeto Android (Capacitor)
        run: npx cap add android

      - name: Gerar ícone do app
        continue-on-error: true
        run: npx @capacitor/assets generate --iconBackgroundColor '#000000' --splashBackgroundColor '#000000'

      - name: Sincronizar arquivos web
        run: npx cap sync android

      - name: Montar o APK (debug)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Renomear o APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Meu-Player-MP3.apk

      - name: Guardar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Player-MP3-apk
          path: Meu-Player-MP3.apk

      - name: Publicar na Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Meu Player MP3 v1.0.${{ github.run_number }}"
          body: |
            APK do Meu Player MP3 para instalar direto no celular.

            Como instalar:
            1. Baixe o arquivo Meu-Player-MP3.apk no celular.
            2. Toque no arquivo e permita "Instalar de fontes desconhecidas" quando o Android pedir.
            3. Abra o app e toque em "Adicionar músicas" para escolher os MP3 do celular.
          files: Meu-Player-MP3.apk
          generate_release_notes: true
