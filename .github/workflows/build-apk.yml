name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.json"
      - "sw.js"
      - "icon.svg"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: Preparar arquivos web
        run: |
          mkdir -p www resources
          cp index.html manifest.json sw.js icon.svg www/
          cp icon.svg resources/icon.svg

      - name: Criar projeto Android (Capacitor)
        run: npx cap add android

      - name: Gerar ícone do app
        continue-on-error: true
        run: npx @capacitor/assets generate --iconBackgroundColor '#000000' --splashBackgroundColor '#000000'

      - name: Sincronizar arquivos web
        run: npx cap sync android

      - name: Montar o APK (debug)
        run: |
          cd android
          ./gradlew assembleDebug
